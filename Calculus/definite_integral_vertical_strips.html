<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Definite integrals — vertical strips</title><style>body{font:16px Arial;margin:22px auto;max-width:1000px;padding:0 18px;color:#222;background:#fafafa}section{background:white;border:1px solid #ddd;border-radius:10px;padding:16px;margin:14px 0}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}label{display:flex;justify-content:space-between;font-weight:bold}input{width:100%}canvas{width:100%;height:470px}.stats{display:flex;justify-content:space-around;flex-wrap:wrap;gap:15px}.stats div{text-align:center}.stats strong{display:block;font-size:24px}small{color:#555}@media(max-width:650px){.controls{grid-template-columns:1fr}canvas{height:340px}}</style></head><body><h2>Definite integrals using vertical strips</h2><p>Explore the area under <b>f(x) = x² + 1</b> using midpoint rectangles. Adjust the integration limits and the number of strips.</p><section class="controls"><div><label>Lower limit a <span id="av">0</span></label><input id="a" type="range" min="-4" max="4" step="0.1" value="0"></div><div><label>Upper limit b <span id="bv">3</span></label><input id="b" type="range" min="-4" max="4" step="0.1" value="3"></div><div><label>Number of strips <span id="nv">6</span></label><input id="n" type="range" min="1" max="100" value="6"></div></section><section><canvas id="plot"></canvas></section><section class="stats"><div>Strip width Δx<strong id="dx"></strong></div><div>Approximate area<strong id="approx"></strong></div><div>Exact area<strong id="exact"></strong></div></section><small id="note"></small><script>const a=document.getElementById('a'),b=document.getElementById('b'),n=document.getElementById('n'),cv=document.getElementById('plot'),ctx=cv.getContext('2d'),f=x=>x*x+1,F=x=>x*x*x/3+x;function draw(){let aa=+a.value,bb=+b.value,N=+n.value,l=Math.min(aa,bb),r=Math.max(aa,bb),w=(r-l)/N,s=0;for(let i=0;i<N;i++)s+=w*f(l+(i+.5)*w);av.textContent=aa.toFixed(1);bv.textContent=bb.toFixed(1);nv.textContent=N;dx.textContent=w.toFixed(3);approx.textContent=s.toFixed(4);exact.textContent=(F(r)-F(l)).toFixed(4);note.textContent=aa>bb?'Limits reversed: geometric area is shown as positive, while the integral from a to b is negative.':'Increasing the number of strips improves the midpoint approximation.';let W=cv.clientWidth,H=cv.clientHeight,L=50,R=15,T=15,B=40,X=x=>L+(x+4.5)/9*(W-L-R),Y=y=>T+(22-y)/22*(H-T-B);ctx.clearRect(0,0,W,H);ctx.font='12px Arial';ctx.strokeStyle='#e2e2e2';ctx.fillStyle='#555';ctx.lineWidth=1;for(let x=-4;x<=4;x++){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),H-B);ctx.stroke();ctx.textAlign='center';ctx.fillText(x,X(x),H-B+18)}for(let y=0;y<=20;y+=5){ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(W-R,Y(y));ctx.stroke();ctx.textAlign='right';ctx.fillText(y,L-7,Y(y)+4)}ctx.fillStyle='rgba(37,113,184,.25)';ctx.strokeStyle='#467da8';ctx.lineWidth=.6;for(let i=0;i<N;i++){let x=l+i*w,h=f(x+w/2);ctx.fillRect(X(x),Y(h),X(x+w)-X(x),Y(0)-Y(h));ctx.strokeRect(X(x),Y(h),X(x+w)-X(x),Y(0)-Y(h))}ctx.strokeStyle='#1265a2';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=800;i++){let x=-4.5+9*i/800;i?ctx.lineTo(X(x),Y(f(x))):ctx.moveTo(X(x),Y(f(x)))}ctx.stroke();ctx.strokeStyle='#cf503f';ctx.setLineDash([5,4]);for(let x of [l,r]){ctx.beginPath();ctx.moveTo(X(x),Y(0));ctx.lineTo(X(x),Y(f(x)));ctx.stroke()}ctx.setLineDash([]);ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(L,Y(0));ctx.lineTo(W-R,Y(0));ctx.stroke()}function resize(){let d=devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}[a,b,n].forEach(x=>x.addEventListener('input',draw));window.addEventListener('resize',resize);resize()</script></body></html>
