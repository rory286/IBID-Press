<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signed area of a cubic</title><style>body{font:16px Arial;background:#f6f8fb;color:#243044;margin:20px auto;max-width:1000px;padding:0 15px}.card{background:white;border:1px solid #ddd;border-radius:10px;padding:16px;margin:14px 0}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}label{display:flex;justify-content:space-between;font-weight:bold}input{width:100%}canvas{width:100%;height:460px}strong{font-size:22px}.stats{display:flex;justify-content:space-around;flex-wrap:wrap;gap:16px;text-align:center}.muted{color:#667;font-size:13px}</style><h2>Signed areas under a cubic</h2><p>Green areas count positively; pink areas count negatively in the definite integral.</p><div class="card"><div class="controls"><div><label>Root 1 <span id="v0"></span></label><input type="range" min="-10" max="10" step=".1" value="-6"></div><div><label>Root 2 <span id="v1"></span></label><input type="range" min="-10" max="10" step=".1" value="-1"></div><div><label>Root 3 <span id="v2"></span></label><input type="range" min="-10" max="10" step=".1" value="5"></div><div><label>Lower limit <span id="v3"></span></label><input type="range" min="-10" max="10" step=".1" value="-8"></div><div><label>Upper limit <span id="v4"></span></label><input type="range" min="-10" max="10" step=".1" value="8"></div></div><p id="eq"></p></div><div class="card"><canvas id="plot"></canvas></div><div class="card stats"><div>Positive area<br><strong id="pos"></strong></div><div>Negative area magnitude<br><strong id="neg"></strong></div><div>Definite integral<br><strong id="net"></strong></div></div><p class="muted" id="note"></p><script>const inputs=[...document.querySelectorAll('input')],cv=document.querySelector('canvas'),c=cv.getContext('2d');function fnum(x){return (+x).toFixed(1)}function factor(r){return r===0?'x':r>0?'(x − '+fnum(r)+')':'(x + '+fnum(-r)+')'}function update(){let [r,s,t,a,b]=inputs.map(e=>+e.value);inputs.forEach((e,i)=>document.getElementById('v'+i).textContent=fnum(e.value));let fun=x=>(x-r)*(x-s)*(x-t),sum=r+s+t,p=r*s+r*t+s*t,q=r*s*t,F=x=>x**4/4-sum*x**3/3+p*x*x/2-q*x;document.getElementById('eq').textContent='f(x) = '+factor(r)+factor(s)+factor(t);let lo=Math.min(a,b),hi=Math.max(a,b),breaks=[lo,...[r,s,t].filter(x=>x>lo&&x<hi).sort((x,y)=>x-y),hi],positive=0,negative=0;for(let i=1;i<breaks.length;i++){let z=F(breaks[i])-F(breaks[i-1]);if(z>0)positive+=z;else negative-=z}pos.textContent=positive.toFixed(3);neg.textContent=negative.toFixed(3);net.textContent=(F(b)-F(a)).toFixed(3);note.textContent=a>b?'Limits reversed: the definite integral changes sign.':a===b?'Equal limits give zero integral.':'Signed integral = positive area − negative area magnitude.';draw(fun,lo,hi,[r,s,t])}function draw(f,lo,hi,roots){let W=cv.clientWidth,H=cv.clientHeight,L=65,R=20,T=20,B=42,w=W-L-R,h=H-T-B,max=1;for(let i=0;i<=1000;i++)max=Math.max(max,Math.abs(f(-10+i/50)));max*=1.12;let X=x=>L+(x+10)/20*w,Y=y=>T+(max-y)/(2*max)*h;c.clearRect(0,0,W,H);c.font='12px Arial';c.strokeStyle='#e5e5e5';c.fillStyle='#555';for(let x=-10;x<=10;x+=2){c.beginPath();c.moveTo(X(x),T);c.lineTo(X(x),H-B);c.stroke();c.textAlign='center';c.fillText(x,X(x),H-B+20)}for(let j=-4;j<=4;j++){let y=j*max/4;c.beginPath();c.moveTo(L,Y(y));c.lineTo(W-R,Y(y));c.stroke();c.textAlign='right';c.fillText(Number(y.toPrecision(3)),L-6,Y(y)+4)}c.save();c.beginPath();c.rect(L,T,w,h);c.clip();for(let i=0;i<1000;i++){let x=lo+(hi-lo)*i/1000,xx=lo+(hi-lo)*(i+1)/1000,y=f((x+xx)/2);c.fillStyle=y>=0?'rgba(30,156,105,.42)':'rgba(218,76,105,.42)';c.fillRect(X(x),Math.min(Y(0),Y(y)),Math.max(.5,X(xx)-X(x)+.3),Math.abs(Y(0)-Y(y)))}c.setLineDash([5,5]);c.strokeStyle='#d28b23';c.lineWidth=2;for(let x of [lo,hi]){c.beginPath();c.moveTo(X(x),T);c.lineTo(X(x),H-B);c.stroke()}c.setLineDash([]);c.strokeStyle='#2165a6';c.lineWidth=3;c.beginPath();for(let i=0;i<=1200;i++){let x=-10+20*i/1200;i?c.lineTo(X(x),Y(f(x))):c.moveTo(X(x),Y(f(x)))}c.stroke();c.restore();c.strokeStyle='#222';c.lineWidth=1.5;c.beginPath();c.moveTo(L,Y(0));c.lineTo(W-R,Y(0));c.stroke();c.beginPath();c.moveTo(X(0),T);c.lineTo(X(0),H-B);c.stroke();c.fillStyle='#2165a6';for(let x of roots){c.beginPath();c.arc(X(x),Y(0),4,0,7);c.fill()}}function resize(){let d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;c.setTransform(d,0,0,d,0,0);update()}inputs.forEach(e=>e.addEventListener('input',update));window.addEventListener('resize',resize);resize();</script></html>
