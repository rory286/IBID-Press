<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Area between curves</title><style>body{font:16px Arial;margin:20px auto;max-width:1000px;padding:0 15px;background:#f7f8fa;color:#223}.box{background:white;border:1px solid #ddd;border-radius:10px;padding:16px;margin:14px 0}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}label{display:flex;justify-content:space-between;font-weight:bold;font-size:14px}input{width:100%}canvas{width:100%;height:470px}#steps{line-height:1.7}strong{font-size:22px}@media(max-width:650px){.controls{grid-template-columns:1fr 1fr}canvas{height:340px}}</style></head><body><h2>Area between two curves</h2><p>Change the quadratic, the line and the integration limits. When the curves cross, the upper and lower functions exchange places.</p><div class="box controls"><div><label>Quadratic shift c <span id="cv"></span></label><input id="c" type="range" min="-8" max="8" step=".1" value="0"></div><div><label>Line slope m <span id="mv"></span></label><input id="m" type="range" min="-4" max="4" step=".1" value="1"></div><div><label>Line intercept k <span id="kv"></span></label><input id="k" type="range" min="-8" max="8" step=".1" value="3"></div><div><label>Lower limit a <span id="av"></span></label><input id="a" type="range" min="-5" max="5" step=".1" value="-3"></div><div><label>Upper limit b <span id="bv"></span></label><input id="b" type="range" min="-5" max="5" step=".1" value="4"></div></div><div class="box"><div id="equations"></div><canvas id="graph"></canvas><p>🟢 Green: quadratic above line. &nbsp; 🔴 Pink: line above quadratic. &nbsp; 🟠 Dashed: integration limits.</p></div><div class="box"><p>Signed integral ∫(f−g)dx: <strong id="signed"></strong> &nbsp; | &nbsp; Geometric area: <strong id="area"></strong></p><div id="steps"></div></div><script>
const ids=['c','m','k','a','b'],els=ids.map(x=>document.getElementById(x)),canvas=document.getElementById('graph'),ctx=canvas.getContext('2d'),fmt=x=>(Math.abs(x)<1e-9?0:x).toFixed(3);
function update(){let [c,m,k,a,b]=els.map(e=>+e.value);ids.forEach((id,i)=>document.getElementById(id+'v').textContent=fmt(+els[i].value));let f=x=>x*x+c,g=x=>m*x+k,h=x=>f(x)-g(x),H=x=>x**3/3-m*x*x/2+(c-k)*x;document.getElementById('equations').textContent=`f(x) = x² + (${fmt(c)});    g(x) = ${fmt(m)}x + (${fmt(k)})`;let d=m*m-4*(c-k),roots=d<0?[]:d<1e-10?[m/2]:[(m-Math.sqrt(d))/2,(m+Math.sqrt(d))/2],lo=Math.min(a,b),hi=Math.max(a,b),inside=roots.filter(x=>x>lo+1e-9&&x<hi-1e-9).sort((x,y)=>x-y),cuts=[lo,...inside,hi],sum=0,lines=[];for(let i=0;i<cuts.length-1;i++){let u=cuts[i],v=cuts[i+1],delta=H(v)-H(u);sum+=Math.abs(delta);lines.push(`[${fmt(u)}, ${fmt(v)}]: ${h((u+v)/2)>=0?'f − g':'g − f'}; area = ${fmt(Math.abs(delta))}`)}document.getElementById('signed').textContent=fmt(H(b)-H(a));document.getElementById('area').textContent=fmt(sum);document.getElementById('steps').innerHTML=`<b>Step 1.</b> Solve f(x)=g(x), or x² − (${fmt(m)})x + (${fmt(c-k)})=0. ${inside.length?'Intersections within limits: '+inside.map(fmt).join(', '):'No crossings strictly inside the selected limits.'}<p><b>Step 2.</b> Use H(x)=x³/3 − (${fmt(m)})x²/2 + (${fmt(c-k)})x as an antiderivative of f−g.</p><p><b>Step 3.</b> Split at crossings and integrate upper minus lower:</p>${lines.join('<br>')}<p><b>Total geometric area = ${fmt(sum)}</b>. ${a>b?'The limits were reversed for the geometric area.':''}</p>`;draw(f,g,h,lo,hi,roots)}
function draw(f,g,h,lo,hi,roots){let W=canvas.clientWidth,H=canvas.clientHeight,L=60,R=20,T=20,B=45,X=x=>L+(x+5.5)/11*(W-L-R),ymin=Infinity,ymax=-Infinity;for(let i=0;i<=600;i++){let x=-5.5+11*i/600;for(let y of [f(x),g(x),0]){ymin=Math.min(ymin,y);ymax=Math.max(ymax,y)}}let pad=Math.max(2,(ymax-ymin)*.12);ymin-=pad;ymax+=pad;let Y=y=>T+(ymax-y)/(ymax-ymin)*(H-T-B);ctx.clearRect(0,0,W,H);ctx.font='12px Arial';ctx.strokeStyle='#e4e4e4';ctx.lineWidth=1;for(let x=-5;x<=5;x++){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),H-B);ctx.stroke();ctx.fillText(x,X(x)-5,H-B+18)}for(let i=0;i<=5;i++){let y=ymin+(ymax-ymin)*i/5;ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(W-R,Y(y));ctx.stroke();ctx.fillText(Number(y.toPrecision(3)),4,Y(y)+4)}ctx.save();ctx.beginPath();ctx.rect(L,T,W-L-R,H-T-B);ctx.clip();for(let i=0;i<800;i++){let x=lo+(hi-lo)*i/800,x2=lo+(hi-lo)*(i+1)/800,mid=(x+x2)/2;ctx.fillStyle=h(mid)>=0?'rgba(44,160,118,.4)':'rgba(220,65,98,.35)';ctx.fillRect(X(x),Math.min(Y(f(mid)),Y(g(mid))),Math.max(.5,X(x2)-X(x)+.5),Math.abs(Y(f(mid))-Y(g(mid))))}ctx.strokeStyle='#dc992f';ctx.setLineDash([6,5]);ctx.lineWidth=2;for(let x of [lo,hi]){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),H-B);ctx.stroke()}ctx.setLineDash([]);for(let [fn,color] of [[f,'#146ca8'],[g,'#8849a8']]){ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=900;i++){let x=-5.5+11*i/900;i?ctx.lineTo(X(x),Y(fn(x))):ctx.moveTo(X(x),Y(fn(x)))}ctx.stroke()}ctx.fillStyle='#222';for(let x of roots.filter(x=>x>=-5.5&&x<=5.5)){ctx.beginPath();ctx.arc(X(x),Y(f(x)),5,0,7);ctx.fill()}ctx.restore();ctx.strokeStyle='#222';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(L,Y(0));ctx.lineTo(W-R,Y(0));ctx.stroke()}
function resize(){let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);update()}els.forEach(e=>e.addEventListener('input',update));window.addEventListener('resize',resize);resize();
</script></body></html>
