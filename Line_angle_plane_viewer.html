<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angle Between a Line and a Plane</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #f7f7f7; font-family: Arial, Helvetica, sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column; }
    model-viewer { flex: 1; width: 100%; min-height: 420px; background: #f7f7f7; }
    .controls { display: flex; justify-content: center; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
    button { font: inherit; padding: 8px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <model-viewer
      id="model"
      src="Line_angle_plane.glb"
      alt="Interactive three-dimensional model showing the angle between a line and a plane"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1"
      exposure="1">
    </model-viewer>
    <div class="controls">
      <button id="reset" type="button">Reset view</button>
    </div>
  </div>
  <script>
    const model = document.getElementById("model");
    const reset = document.getElementById("reset");
    reset.addEventListener("click", () => {
      model.cameraOrbit = "auto auto auto";
      model.cameraTarget = "auto auto auto";
      model.fieldOfView = "auto";
      model.jumpCameraToGoal();
    });
  </script>
</body>
</html>
