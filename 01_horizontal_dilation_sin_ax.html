<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horizontal dilation: y = sin(ax)</title><style>
:root{--bg:#f5f6f7;--panel:#fff;--text:#1f2933;--muted:#66727d;--border:#cfd6dc;--series:#b13f3f;--reference:#6f7c87}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}main{max-width:1100px;margin:auto;padding:28px 22px 40px}h1{margin:0 0 6px;font-size:28px}.subtitle{color:var(--muted);margin-bottom:20px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px;align-items:start}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}svg{width:100%;height:auto;display:block}label{display:block;font-weight:600;margin-bottom:8px}input[type=range]{width:100%}.metric{margin-top:10px;line-height:1.55}.small{color:var(--muted);font-size:14px}.controls button{margin-top:14px;min-height:42px;padding:8px 14px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);cursor:pointer}.checkbox{margin-top:14px;display:flex;gap:8px;align-items:center;font-weight:400}@media(max-width:780px){.layout{grid-template-columns:1fr}}
</style></head><body><main><h1>Horizontal dilation: y = sin(ax)</h1><div class="subtitle">Move the slider and watch how changing a alters the period.</div><div class="layout"><section class="card"><svg id="plot" viewBox="0 0 760 390"></svg></section><aside class="card controls"><label>Value of a: <span id="v">1.00</span></label><input id="s" type="range" min="0.25" max="4" step="0.05" value="1"><div class="metric">Period: <strong id="p">2π</strong></div><label class="checkbox"><input id="r" type="checkbox" checked> Show y = sin(x)</label><button id="b">Reset</button><p class="small">a &gt; 1 compresses horizontally; 0 &lt; a &lt; 1 stretches.</p></aside></div></main><script>
const NS='http://www.w3.org/2000/svg',W=760,H=390,M={l:52,r:20,t:18,b:42};
const xmin=-2*Math.PI,xmax=2*Math.PI; let ymin=-1.6,ymax=1.6;
const X=x=>M.l+(x-xmin)/(xmax-xmin)*(W-M.l-M.r),Y=y=>H-M.b-(y-ymin)/(ymax-ymin)*(H-M.t-M.b);
function el(n,a={}){const e=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}
function addText(svg,x,y,s,anchor='middle'){const n=el('text',{x,y,'text-anchor':anchor,'font-size':13,fill:'var(--muted)'});n.textContent=s;svg.appendChild(n)}
function addLine(svg,x1,y1,x2,y2,c='var(--border)',w=1,d=''){const n=el('line',{x1,y1,x2,y2,stroke:c,'stroke-width':w});if(d)n.setAttribute('stroke-dasharray',d);svg.appendChild(n)}
function drawAxes(svg){svg.innerHTML='';for(let y=Math.ceil(ymin);y<=Math.floor(ymax);y++)addLine(svg,X(xmin),Y(y),X(xmax),Y(y),'var(--border)',1,y===0?'':'4 4');[-2,-1.5,-1,-.5,0,.5,1,1.5,2].forEach(k=>addLine(svg,X(k*Math.PI),Y(ymin),X(k*Math.PI),Y(ymax),'var(--border)',1,k===0?'':'4 4'));addLine(svg,X(xmin),Y(0),X(xmax),Y(0),'var(--text)',1.4);addLine(svg,X(0),Y(ymin),X(0),Y(ymax),'var(--text)',1.4);[[-2,'−2π'],[-1.5,'−3π/2'],[-1,'−π'],[-.5,'−π/2'],[.5,'π/2'],[1,'π'],[1.5,'3π/2'],[2,'2π']].forEach(([k,s])=>addText(svg,X(k*Math.PI),H-14,s));for(let y=Math.ceil(ymin);y<=Math.floor(ymax);y++)if(y!==0)addText(svg,42,Y(y)+4,String(y),'end')}
function graphPath(fn){let d='';const N=1200;for(let i=0;i<=N;i++){const x=xmin+(xmax-xmin)*i/N,y=fn(x);d+=(d?'L':'M')+X(x).toFixed(2)+','+Y(y).toFixed(2)+' '}return d}
function addCurve(svg,fn,c='var(--series)',w=3,d=''){const p=el('path',{d:graphPath(fn),fill:'none',stroke:c,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round'});if(d)p.setAttribute('stroke-dasharray',d);svg.appendChild(p)}
const svg=document.getElementById('plot'),s=document.getElementById('s'),v=document.getElementById('v'),p=document.getElementById('p'),r=document.getElementById('r');function u(){const a=+s.value;drawAxes(svg);if(r.checked)addCurve(svg,x=>Math.sin(x),'var(--reference)',2,'7 6');addCurve(svg,x=>Math.sin(a*x));v.textContent=a.toFixed(2);p.textContent=(2/a).toFixed(2)+'π'}s.oninput=u;r.onchange=u;document.getElementById('b').onclick=()=>{s.value=1;u()};u();</script></body></html>
