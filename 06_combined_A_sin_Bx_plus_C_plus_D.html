<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>y = A sin(Bx + C) + D</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:#f5f6f7;color:#1f2933}main{max-width:1100px;margin:auto;padding:28px 22px}h1{margin:0 0 6px}.sub{color:#66727d;margin-bottom:20px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.card{background:white;border:1px solid #cfd6dc;border-radius:14px;padding:16px}svg{width:100%;height:auto}.control{margin-bottom:15px}label{display:block;font-weight:600;margin-bottom:7px}input[type=range]{width:100%}.metric{margin-top:9px;line-height:1.5}.check{display:flex;gap:8px;align-items:center;font-weight:400;margin-top:14px}button{margin-top:14px;padding:10px 14px;border:1px solid #cfd6dc;border-radius:9px;background:white}.small{color:#66727d;font-size:14px}@media(max-width:780px){.layout{grid-template-columns:1fr}}</style></head><body><main><h1>Combined transformations: y = A sin(Bx + C) + D</h1><div class="sub">Move the four sliders to investigate all transformations together.</div><div class="layout"><section class="card"><svg id="plot" viewBox="0 0 760 390"></svg></section><aside class="card"><div class="control"><label>A: <span id="Av">1.00</span></label><input id="A" type="range" min="-3" max="3" step="0.1" value="1"></div><div class="control"><label>B: <span id="Bv">1.00</span></label><input id="B" type="range" min="0.25" max="4" step="0.05" value="1"></div><div class="control"><label>C: <span id="Cv">0.00</span></label><input id="C" type="range" min="-3.14159" max="3.14159" step="0.05" value="0"></div><div class="control"><label>D: <span id="Dv">0.00</span></label><input id="D" type="range" min="-2" max="2" step="0.1" value="0"></div><div class="metric">Function:<br><strong id="fn">y = sin(x)</strong></div><div class="metric">Amplitude: <strong id="amp">1.00</strong></div><div class="metric">Period: <strong id="period">2π</strong></div><div class="metric">Horizontal shift: <strong id="shift">0.00</strong> rad</div><div class="metric">Midline: <strong id="mid">y = 0.00</strong></div><label class="check"><input id="ref" type="checkbox" checked> Show y = sin(x) for comparison</label><button id="reset">Reset all</button><p class="small">For y = A sin(Bx + C) + D, the horizontal shift is −C/B.</p></aside></div></main><script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('plot'),W=760,H=390,M={l:52,r:20,t:18,b:42},xmin=-2*Math.PI,xmax=2*Math.PI,ymin=-3.3,ymax=3.3;const X=x=>M.l+(x-xmin)/(xmax-xmin)*(W-M.l-M.r),Y=y=>H-M.b-(y-ymin)/(ymax-ymin)*(H-M.t-M.b);function el(n,a={}){let q=document.createElementNS(NS,n);for(let k in a)q.setAttribute(k,a[k]);return q}function line(x1,y1,x2,y2,c='#d8dde2',w=1,d=''){let q=el('line',{x1,y1,x2,y2,stroke:c,'stroke-width':w});if(d)q.setAttribute('stroke-dasharray',d);svg.appendChild(q)}function txt(x,y,s,anchor='middle'){let q=el('text',{x,y,'text-anchor':anchor,'font-size':13,fill:'#66727d'});q.textContent=s;svg.appendChild(q)}function axes(){svg.innerHTML='';[-3,-2,-1,0,1,2,3].forEach(y=>line(X(xmin),Y(y),X(xmax),Y(y),'#d8dde2',1,y?'4 4':''));[-2,-1.5,-1,-.5,0,.5,1,1.5,2].forEach(k=>line(X(k*Math.PI),Y(ymin),X(k*Math.PI),Y(ymax),'#d8dde2',1,k?'4 4':''));line(X(xmin),Y(0),X(xmax),Y(0),'#26323c',1.4);line(X(0),Y(ymin),X(0),Y(ymax),'#26323c',1.4);[[-2,'−2π'],[-1.5,'−3π/2'],[-1,'−π'],[-.5,'−π/2'],[.5,'π/2'],[1,'π'],[1.5,'3π/2'],[2,'2π']].forEach(v=>txt(X(v[0]*Math.PI),H-14,v[1]));[-3,-2,-1,1,2,3].forEach(y=>txt(42,Y(y)+4,String(y),'end'))}function curve(fn,c,w,d=''){let s='';for(let i=0;i<=1200;i++){let x=xmin+(xmax-xmin)*i/1200,y=fn(x);s+=(i?'L':'M')+X(x).toFixed(2)+','+Y(y).toFixed(2)+' '}let p=el('path',{d:s,fill:'none',stroke:c,'stroke-width':w,'stroke-linecap':'round'});if(d)p.setAttribute('stroke-dasharray',d);svg.appendChild(p)}const A=document.getElementById('A'),B=document.getElementById('B'),C=document.getElementById('C'),D=document.getElementById('D'),ref=document.getElementById('ref');function pt(b){let p=2/b;if(Math.abs(p-2)<1e-6)return'2π';if(Math.abs(p-1)<1e-6)return'π';if(Math.abs(p-.5)<1e-6)return'π/2';return p.toFixed(2)+'π'}function update(){let a=+A.value,b=+B.value,c=+C.value,d=+D.value;axes();if(ref.checked)curve(x=>Math.sin(x),'#74808a',2,'7 6');curve(x=>a*Math.sin(b*x+c)+d,'#b13f3f',3);line(X(xmin),Y(d),X(xmax),Y(d),'#b13f3f',1.2,'5 5');Av.textContent=a.toFixed(2);Bv.textContent=b.toFixed(2);Cv.textContent=c.toFixed(2);Dv.textContent=d.toFixed(2);fn.textContent='y = '+a.toFixed(2)+' sin('+b.toFixed(2)+'x '+(c>=0?'+ ':'− ')+Math.abs(c).toFixed(2)+') '+(d>=0?'+ ':'− ')+Math.abs(d).toFixed(2);amp.textContent=Math.abs(a).toFixed(2);period.textContent=pt(b);shift.textContent=(-c/b).toFixed(2);mid.textContent='y = '+d.toFixed(2)}[A,B,C,D].forEach(q=>q.addEventListener('input',update));ref.addEventListener('change',update);reset.addEventListener('click',()=>{A.value=1;B.value=1;C.value=0;D.value=0;update()});update();
</script></body></html>
